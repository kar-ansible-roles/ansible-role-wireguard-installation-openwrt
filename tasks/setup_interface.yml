# Setup {{ wg_server_interface }} configuration
- name: Setting up Wireguard interfaces | Create wg interface if missing
  command: uci set network.{{ wg_server_interface }}='interface'

- name: Setting up Wireguard interfaces | Set proto
  command: uci set network.{{ wg_server_interface }}.proto='wireguard'

- name: Setting up Wireguard interfaces | Set private key
  command: uci set network.{{ wg_server_interface }}.private_key='{{ server_private_key }}'

- name: Setting up Wireguard interfaces | Set listen port
  command: uci set network.{{ wg_server_interface }}.listen_port='{{ wg_server_port }}'

- name: Setting up Wireguard interfaces | Set wg address if not present
  command: uci set network.{{ wg_server_interface }}.addresses='{{ wg_network }}'

- name: Setting up Wireguard interfaces | Setup lan ip configuration
  command: uci set network.lan.ipaddr='10.10.0.1'
  notify: 
    - Apply network
    - Restart network

# Setup peer configuration
- name: Setting up Wireguard interfaces | Set peer section
  command: uci set network.peer_client1=wireguard_{{ wg_server_interface }}
  register: peer_section

- name: Setting up Wireguard interfaces | Set peer public key
  command: uci set network.peer_client1.public_key='{{ client_public_key }}'

- name: Setting up Wireguard interfaces | Set allowed IPs
  command: uci set network.peer_client1.allowed_ips='{{ wg_client_ip }}'
  notify: 
    - Apply network
    - Restart network
